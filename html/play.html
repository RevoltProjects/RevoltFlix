<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevoltFlix - Watch Movie</title>
    <link rel="stylesheet" href="../css/view.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: #0b0b0b;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 40px;
        }
        .watch-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }
        .back-btn {
            background: transparent;
            border: 1px solid #333;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .details-box {
            display: flex;
            gap: 30px;
            background: #141414;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #222;
        }
        .poster-img {
            width: 250px;
            height: 375px;
            object-fit: cover;
            border-radius: 8px;
        }
        .info-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .movie-title {
            margin-top: 0;
            font-size: 2rem;
        }
        .movie-overview {
            color: #aaa;
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 30px;
        }
        .watch-btn {
            padding: 14px 28px;
            background: var(--brand-red, #e50914);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: fit-content;
            transition: background 0.2s;
        }
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .player-frame-container {
            position: relative;
            width: 85%;
            height: 80vh;
        }
        .close-player-btn {
            position: absolute;
            top: -40px;
            right: 0;
            background: #e50914;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .video-iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    
    <div class="watch-wrapper">
        <button class="back-btn" onclick="window.history.back()">&larr; Back</button>
        
        <div class="details-box">
            <img id="moviePoster" class="poster-img" src="" alt="Poster">
            <div class="info-box">
                <h1 id="movieTitle" class="movie-title">Loading...</h1>
                <p id="movieOverview" class="movie-overview"></p>
                <button class="watch-btn" onclick="expandPlayer()">Watch</button>
            </div>
        </div>
    </div>

    <div id="playerModal" class="player-modal">
        <div class="player-frame-container">
            <button class="close-player-btn" onclick="closePlayer()">Close</button>
            <iframe id="videoPlayer" class="video-iframe" sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tmdbId = urlParams.get('id');
        const BACKEND_URL = "https://revolt-flix-backend.vercel.app/api";

        async function loadMovieDetails() {
            if (!tmdbId) return;
            try {
                const response = await fetch(`${BACKEND_URL}/get-movies`);
                const movies = await response.json();
                const movie = movies.find(m => m.id == tmdbId);

                if (movie) {
                    document.getElementById('movieTitle').innerText = movie.title || movie.name;
                    document.getElementById('movieOverview').innerText = movie.overview || "No description available for this title.";
                    document.getElementById('moviePoster').src = `https://image.tmdb.org/t/p/w500${movie.poster_path}`;
                }
            } catch (err) {
                console.error("Failed to load movie details");
            }
        }

        function expandPlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoPlayer');
            iframe.src = `https://vidsrc.sbs/embed/movie/${tmdbId}`;
            modal.style.display = 'flex';
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            const iframe = document.getElementById('videoPlayer');
            iframe.src = '';
            modal.style.display = 'none';
        }

        loadMovieDetails();
    </script>
</body>
</html>
