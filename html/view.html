<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevoltFlix - Browse</title>
    <link rel="stylesheet" href="../css/view.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>RevoltFlix</h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-category="movies">
                    <i data-lucide="film"></i> Movies
                </button>
                <button class="nav-item" data-category="youtube">
                    <i data-lucide="youtube"></i> YouTube
                </button>
                <button class="nav-item" data-category="music">
                    <i data-lucide="music"></i> Music
                </button>
                <button class="nav-item" data-category="radio">
                    <i data-lucide="radio"></i> Live Radio
                </button>
            </nav>
            <div class="sidebar-profile" style="margin-top: auto; padding: 20px; border-top: 1px solid #222; display: flex; align-items: center; gap: 10px;">
                <i data-lucide="user" style="color: var(--brand-red, #e50914);"></i>
                <span id="profileBadge" style="color: #fff; font-weight: 500;">Profile</span>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1 id="categoryTitle">Movies</h1>
                <div class="user-profile-display">
                    <span id="profileNameDisplay">User</span>
                </div>
            </header>

            <section class="browse-section">
                <div class="search-container" style="display: flex; gap: 10px; margin-bottom: 25px;">
                    <input type="text" id="searchInput" placeholder="Search movies..." style="padding: 12px 16px; width: 350px; background: #141414; border: 1px solid #333; color: #fff; border-radius: 30px; outline: none; font-size: 0.95rem;">
                    <button id="searchBtn" style="padding: 12px 24px; background: var(--brand-red, #e50914); color: white; border: none; border-radius: 30px; cursor: pointer; font-weight: 600; transition: background 0.2s;">Search</button>
                </div>

                <div id="contentGrid" class="content-grid"></div>
            </section>
        </main>
    </div>

    <div id="playerModal" class="player-modal">
        <div class="player-container">
            <button class="close-player" onclick="closePlayer()">Close</button>
            <iframe id="videoPlayer" sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen></iframe>
        </div>
    </div>

    <script src="../js/view.js"></script>
</body>
</html>
