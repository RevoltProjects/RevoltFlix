<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevoltFlix - Browse</title>
    <link rel="stylesheet" href="../css/view.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2>Revolt<span style="color:var(--brand-red);">Flix</span></h2>
            </div>
            <div class="sidebar-nav">
                <button class="nav-item active" data-category="movies">
                    <i data-lucide="film"></i> Movies
                </button>
                <button class="nav-item" data-category="series">
                    <i data-lucide="tv"></i> Series
                </button>
                <button class="nav-item" data-category="youtube">
                    <i data-lucide="monitor-play"></i> YouTube
                </button>
                <button class="nav-item" data-category="music">
                    <i data-lucide="music"></i> Music
                </button>
                <button class="nav-item" data-category="radio">
                    <i data-lucide="radio"></i> Live Radio
                </button>
            </div>
            <div class="sidebar-profile-container">
                <div class="sidebar-profile">
                    <i data-lucide="user" style="width: 20px; height: 20px; color: var(--brand-red);"></i>
                    <span id="profileBadge">Profile</span>
                </div>
                <button class="switch-account-btn" onclick="switchToProfileSelect()">Switch Profile</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="content-header">
                <h1 id="categoryTitle">Movies</h1>
            </div>

            <div id="musicSwitcherContainer" style="display: none; gap: 10px; margin-bottom: 20px;">
                <button class="rounded-switcher-btn active" data-provider="jamendo" onclick="switchMusicProvider('jamendo')">Jamendo</button>
                <button class="rounded-switcher-btn" data-provider="deezer" onclick="switchMusicProvider('deezer')">Deezer</button>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search movies...">
                <button id="searchBtn">
                    <i data-lucide="search" style="width: 18px; height: 18px;"></i>
                    <span>Search</span>
                </button>
            </div>

            <div id="contentGrid" class="content-grid"></div>
        </main>
    </div>

    <div id="detailsModal" class="details-modal">
        <div class="details-container">
            <button class="close-details" onclick="closeDetailsModal()">&larr; Back</button>
            <div class="details-box">
                <img id="detailPoster" src="" alt="Poster" class="poster-img">
                <div class="info-box">
                    <h2 id="detailTitle" class="movie-title"></h2>
                    <p id="detailOverview" class="movie-overview"></p>
                    <div id="actionArea"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="playerModal" class="player-modal">
        <div class="player-frame-container">
            <button class="close-player-btn" onclick="closePlayer()">Close</button>
            <iframe id="videoPlayer" class="video-iframe" sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen></iframe>
        </div>
    </div>

    <div id="audioDock" class="audio-dock" style="display: none;">
        <div class="audio-dock-info">
            <img id="dockThumb" src="" alt="" class="dock-thumb">
            <div class="dock-text">
                <p id="dockTitle" class="dock-title">Not Playing</p>
                <p id="dockArtist" class="dock-artist">-</p>
            </div>
        </div>
        
        <div class="audio-dock-center">
            <div class="audio-dock-controls">
                <button class="dock-ctrl-btn" onclick="toggleShuffle()"><i data-lucide="shuffle" id="dockShuffleIcon"></i></button>
                <button class="dock-ctrl-btn" onclick="playPrevious()"><i data-lucide="skip-back"></i></button>
                <button class="dock-ctrl-btn play-btn" onclick="togglePlayState()"><i id="dockPlayIcon" data-lucide="play"></i></button>
                <button class="dock-ctrl-btn" onclick="playNext()"><i data-lucide="skip-forward"></i></button>
                <button class="dock-ctrl-btn" onclick="toggleLoopState()"><i data-lucide="repeat" id="dockLoopIcon"></i></button>
            </div>
            <div class="audio-progress">
                <span id="currentTime">0:00</span>
                <input type="range" id="progressBar" class="progress-slider" value="0" min="0" max="100">
                <span id="totalTime">0:00</span>
            </div>
        </div>

        <div class="audio-dock-right">
            <i data-lucide="volume-2" class="volume-icon"></i>
            <input type="range" id="volumeBar" class="progress-slider volume-slider" value="100" min="0" max="100">
        </div>
        
        <audio id="globalAudioElement"></audio>
    </div>

    <script src="../js/dock.js"></script>
    <script src="../js/view.js"></script>
</body>
</html>
