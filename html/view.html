<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevoltFlix - Browse</title>
    <link rel="stylesheet" href="../css/view.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h2><span style="color: var(--brand-red);">Revolt</span><span style="color: #fff;">Flix</span></h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-category="movies">
                    <i data-lucide="film"></i> Movies
                </button>
                <button class="nav-item" data-category="series">
                    <i data-lucide="tv"></i> Series
                </button>
                <button class="nav-item" data-category="youtube">
                    <i data-lucide="youtube"></i> YouTube
                </button>
                <button class="nav-item" data-category="music">
                    <i data-lucide="music"></i> Music
                </button>
                <button class="nav-item" data-category="radio">
                    <i data-lucide="radio"></i> Live Radio
                </button>
            </nav>
            <div class="sidebar-profile-container">
                <div class="sidebar-profile">
                    <i data-lucide="user" style="color: var(--brand-red);"></i>
                    <span id="profileBadge">Profile</span>
                </div>
                <button class="switch-account-btn" onclick="switchToProfileSelect()">Switch Accounts</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h1 id="categoryTitle">Movies</h1>
            </header>

            <section class="browse-section">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search...">
                    <button id="searchBtn">Search</button>
                </div>

                <div id="contentGrid" class="content-grid"></div>
            </section>
        </main>
    </div>

    <div id="detailsModal" class="details-modal">
        <div class="details-container">
            <button class="close-details" onclick="closeDetailsModal()">Back</button>
            <div class="details-box">
                <img id="detailPoster" class="poster-img" src="" alt="Poster">
                <div class="info-box">
                    <h1 id="detailTitle" class="movie-title">Loading...</h1>
                    <p id="detailOverview" class="movie-overview"></p>
                    <div id="actionArea"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="playerModal" class="player-modal">
        <div class="player-frame-container">
            <button class="close-player-btn" onclick="closePlayer()">Close</button>
            <iframe id="videoPlayer" class="video-iframe" sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen></iframe>
        </div>
    </div>

    <script src="../js/view.js"></script>
</body>
</html>
