<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - RevoltFlix</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg-black: #000000;
            --brand-red: #E50914;
            --brand-red-hover: #b20710;
            --text-white: #FFFFFF;
            --text-gray: #b3b3b3;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hero-wrapper {
            position: relative;
            width: 92vw;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .brand-top-left {
            position: absolute;
            top: 30px;
            left: 40px;
            z-index: 10;
        }

        .brand-top-left a {
            text-decoration: none;
        }

        .brand-top-left h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 2px;
            color: var(--brand-red);
        }

        .brand-top-left h1 span {
            color: var(--text-white);
        }

        .main-box {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #0a0a0a;
            border: 2px solid var(--brand-red);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.3);
            padding: 40px;
        }

        .form-content {
            width: 100%;
            max-width: 400px;
            background-color: #141414;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .form-content h2 {
            font-size: 2rem;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #1f1f1f;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-white);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--brand-red);
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.4);
            background-color: #262626;
        }

        .action-buttons-bottom-right {
            position: absolute;
            bottom: 35px;
            right: 35px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        .btn-login {
            background-color: var(--text-white);
            color: var(--bg-black);
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-flex;
            align-items: center;
        }

        .btn-login:hover {
            background-color: #e6e6e6;
        }

        .btn-signup {
            background-color: var(--brand-red);
            color: var(--text-white);
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
            display: inline-flex;
            align-items: center;
        }

        .btn-signup:hover {
            background-color: var(--brand-red-hover);
        }

        .btn-login:active, .btn-signup:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="hero-wrapper">
        <div class="brand-top-left">
            <a href="../index.html"><h1>REVOLT<span>FLIX</span></h1></a>
        </div>

        <div class="main-box">
            <div class="form-content">
                <h2>Log In</h2>
                <form id="login-form">
                    <div class="input-group">
                        <label for="email">Email or Username</label>
                        <input type="text" id="email" placeholder="name@example.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </form>
            </div>

            <div class="action-buttons-bottom-right">
                <button type="submit" form="login-form" class="btn-login">Log In</button>
                <a href="signup.html" class="btn-signup">Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log("Login page initialized.");
        });
    </script>
</body>
</html>
