<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Watching - RevoltFlix</title>
    <link rel="stylesheet" href="../css/watching.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="hero-wrapper">
        <div class="brand-top-left">
            <a href="../index.html"><h1>REVOLT<span>FLIX</span></h1></a>
        </div>

        <div class="main-box">
            <div class="watching-container">
                <h2>Who's Watching?</h2>
                <div class="profiles-grid" id="profilesGrid">
                    <div class="profile-slot empty-slot" onclick="openCreateModal()">
                        <div class="plus-icon-box"><i data-lucide="plus"></i></div>
                        <span>Add Profile</span>
                    </div>
                    <div class="profile-slot empty-slot" onclick="openCreateModal()">
                        <div class="plus-icon-box"><i data-lucide="plus"></i></div>
                        <span>Add Profile</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="createModal">
        <div class="modal-box">
            <h3>Create Profile</h3>
            <form id="profileForm">
                <div class="input-group">
                    <label>Nickname</label>
                    <input type="text" id="profileName" required placeholder="Enter nickname">
                </div>
                <div class="input-group">
                    <label>4-Digit PIN</label>
                    <input type="password" id="profilePin" maxlength="4" pattern="\d{4}" required placeholder="••••">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeCreateModal()">Cancel</button>
                    <button type="submit" class="btn-save">Save Profile</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="pinModal">
        <div class="modal-box">
            <h3 id="pinModalTitle">Enter PIN</h3>
            <form id="pinForm">
                <div class="input-group">
                    <input type="password" id="enteredPin" maxlength="4" pattern="\d{4}" required placeholder="••••">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closePinModal()">Cancel</button>
                    <button type="submit" class="btn-save">Confirm</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="../js/watching.js"></script>
</body>
</html>
