<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - RevoltFlix</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="signup-container">
        <div class="logo-area">
            <h1>REVOLT<span>FLIX</span></h1>
            <p>Unlimited movies, TV shows, and more.</p>
        </div>

        <div class="form-card">
            <h2>Sign Up</h2>
            
            <div id="form-message" class="hidden"></div>

            <form id="signup-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required>
                </div>

                <button type="submit" class="btn-submit">Sign Up</button>
            </form>

            <div class="form-footer">
                <p>Already have an account? <a href="#">Sign in now.</a></p>
            </div>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
